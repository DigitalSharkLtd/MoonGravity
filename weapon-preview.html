<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOON GRAVITY — weapon & device preview</title>
    <style>
      html,body{margin:0;background:#000;overflow:hidden}
      #game{position:fixed;inset:0;width:100vw;height:100vh}
      #labels{position:fixed;inset:0;pointer-events:none}
      .lbl{position:absolute;transform:translate(-50%,0);color:#e8f4ff;font:600 11px/1.2 monospace;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap}
      #dbg{position:fixed;left:8px;top:8px;color:#9fe;font:12px monospace;white-space:pre;pointer-events:none;text-shadow:0 1px 2px #000}
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="labels"></div>
    <div id="dbg"></div>
    <script type="module" src="/src/weaponPreview.ts"></script>
  </body>
</html>
